name: Publish to npm

# Reusable workflow that owns the npm publish step and NOTHING ELSE.
#
# IMPORTANT — this is a REUSABLE workflow ONLY (`workflow_call`). It has no
# direct event trigger, so it is NEVER the initiating workflow for an OIDC
# publish. That is deliberate:
#
#   * npm allows exactly ONE trusted-publisher workflow filename per package
#     ("Each package can only have one trusted publisher configured at a time" —
#     https://docs.npmjs.com/trusted-publishers/).
#   * For reusable workflows npm validates the OIDC token against the
#     *initiating* (top-level) workflow, not the file that runs `npm publish`:
#     "validation checks the calling workflow's name instead of the workflow
#     that actually contains the publish command."
#
#   Therefore EVERY publish — automatic and manual recovery — is initiated from
#   release-please.yml and calls this file via `workflow_call`. npm's single
#   trusted publisher is bound to `release-please.yml`. If this file had its own
#   `workflow_dispatch`/`push` trigger, that path's OIDC identity would be
#   `publish.yml` and npm would reject it (only one trusted filename allowed).
#   To run a manual recovery publish, dispatch release-please.yml with the tag
#   ref — see its header. This workflow is idempotent (skips if the version is
#   already on npm), so recovery re-runs can never error on a partial release.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag) to check out and publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege — only needs to read code to build/publish
      id-token: write # npm OIDC Trusted Publishing (provenance)
    steps:
      # Validate the ref BEFORE checkout. On the manual recovery path the ref is
      # an operator-supplied dispatch input; a typo (e.g. "1.2.0" or "main")
      # would otherwise check out and publish the wrong thing. Require a
      # `v<semver>` release tag so only intended releases can be published.
      - name: Validate release ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid publish ref '$REF' — expected a release tag like v1.2.0."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Publish exactly the released commit/ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # Build runtime comes from .nvmrc (Node 24.18.0, which bundles
          # npm 11.16.0 — above the >=11.5.1 Trusted Publishing minimum).
          node-version-file: '.nvmrc'
          # No registry-url here — setup-node's auto-generated .npmrc would
          # inject NODE_AUTH_TOKEN and break OIDC trusted publishing.

      # Fail loudly if the bundled npm cannot do Trusted Publishing.
      - name: Verify npm supports Trusted Publishing
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=5)?0:1)' "$npm_version"; then
            echo "::error::npm $npm_version is below 11.5.1; Trusted Publishing needs >=11.5.1."
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Idempotency guard: if this exact version is already on npm (e.g. a prior
      # run published successfully but a later step failed, or a manual recovery
      # run is racing the auto-publish), skip the publish so re-runs never error.
      - id: check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} already on npm — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC Trusted Publishing — no token needed.
      # https://docs.npmjs.com/trusted-publishers
      - if: ${{ steps.check.outputs.already_published == 'false' }}
        run: npm publish --access public --provenance
